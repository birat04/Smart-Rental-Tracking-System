<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Caterpillar Safety Yellow Gradient -->
    <linearGradient id="catYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFD13B" />
      <stop offset="50%" stopColor="#F5B800" />
      <stop offset="100%" stopColor="#D49B00" />
    </linearGradient>

    <!-- Dark Carbon Industrial Gradient -->
    <linearGradient id="carbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#252B35" />
      <stop offset="100%" stopColor="#0E1217" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F5B800" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Hexagonal Shield / Tread Frame Base -->
  <polygon
    points="60,6 108,32 108,88 60,114 12,88 12,32"
    fill="url(#carbonDark)"
    stroke="#30363D"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Cyber Grid Accent Lines -->
  <line x1="12" y1="32" x2="60" y2="60" stroke="#F5B800" stroke-width="1.2" stroke-opacity="0.25" />
  <line x1="108" y1="32" x2="60" y2="60" stroke="#F5B800" stroke-width="1.2" stroke-opacity="0.25" />
  <line x1="60" y1="114" x2="60" y2="60" stroke="#F5B800" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Iconic Industrial Cat Triangle Crest -->
  <polygon
    points="60,20 98,84 22,84"
    fill="url(#catYellow)"
    filter="url(#yellowGlow)"
    stroke="#111418"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Precision Telemetry Signal Core -->
  <polygon
    points="60,42 82,78 38,78"
    fill="#0A0C0F"
    stroke="#F5B800"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Active Telemetry Sensor Pulse Center -->
  <circle cx="60" cy="64" r="5.5" fill="#F5B800" />
  <circle cx="60" cy="64" r="9" fill="none" stroke="#F5B800" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.85" />
  <circle cx="60" cy="64" r="2.5" fill="#0A0C0F" />

  <!-- Heavy Equipment Tread Cutouts Base -->
  <rect x="28" y="93" width="14" height="4" rx="1.5" fill="#484F58" />
  <rect x="53" y="93" width="14" height="4" rx="1.5" fill="#F5B800" />
  <rect x="78" y="93" width="14" height="4" rx="1.5" fill="#484F58" />
</svg>
